[package]
name = "working-stack"
version = "0.1.0"
edition = "2021"
description = "Working Stack：用户拥有、人/AI 共用的工作状态树（CLI + Web 同源）"
include = ["Cargo.toml", "Cargo.lock", "src/**", "assets/**", "docs/**", "skills/**", "examples/**", "README.md", "playground.md", "install.sh", "install.ps1"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
